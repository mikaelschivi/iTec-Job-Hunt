name: itec-watcher

services:
  watcher:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    volumes:
      - itec-watcher-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/heartbeat') < 900 else 1)"
      interval: 60s
      start_period: 120s

volumes:
  itec-watcher-data:
